[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-qa"
version = "0.1.0"
description = "Catch small requirement risks before they grow into costly defects"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openai-codex>=0.147.0,<0.148.0",
    "pydantic>=2.0,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
butterfly-qa = "qa_agent.cli:main"
butterfly-qa-api = "qa_agent.web.app:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qa_agent.web" = ["static/**"]
