services:
  butterfly-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: butterfly-agent:local
    ports:
      - "${BUTTERFLY_QA_PORT:-8000}:8000"
    environment:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - "./projects:/app/projects"
      - "${CODEX_AUTH_FILE}:/root/.codex/auth.json:ro"
      - "${CODEX_CONFIG_FILE}:/root/.codex/config.toml:ro"
    restart: unless-stopped
